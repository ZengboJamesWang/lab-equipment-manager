version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: labmanager-db
    restart: always
    environment:
      POSTGRES_DB: lab_manager
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: "[Bobo1216]"
    ports:
      - "5433:5432" # Mapping to 5433 to avoid conflict with your local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: labmanager-backend
    restart: always
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lab_manager
      DB_USER: lab_admin
      DB_PASSWORD: "[Bobo1216]"
      JWT_SECRET: tLGKLum8iqw7NIxo7wieNHLboPkQbYTHk29bSHDUriD9Vi6IgpAsnMOPLpjA2+t2
      PORT: 5000
      CORS_ORIGIN: http://localhost
    ports:
      - "5001:5000"

  frontend:
    build: ./frontend
    container_name: labmanager-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
